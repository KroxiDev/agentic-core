name: Aceptación Linux

on:
  pull_request:
    paths:
      - '.github/workflows/linux-acceptance.yml'
      - 'scripts/linux-acceptance.mjs'
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - 'third_party/**'
      - 'package*.json'
      - 'adapters/**'
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Preparar dependencias independientes
        run: |
          python -m pip install pytest==8.3.5 py==1.11.0
          npm ci
          mkdir -p .codex-temp/linux-artifacts
      - name: Recorrido del paquete instalado
        run: node --test --test-reporter=tap scripts/linux-acceptance.mjs | tee .codex-temp/linux-artifacts/installed.tap
      - name: Regresiones puntuales de mutación, exportación y diagnóstico
        run: |
          node --test --test-reporter=tap --test-concurrency=1 \
            --test-name-pattern='installed mutate4py executes the authoritative corpus|installed export is explicit|installed diagnosis explains current' \
            test/quality-python-mutation.test.js test/quality-result-export.test.js test/quality-diagnostics.test.js \
            | tee .codex-temp/linux-artifacts/regressions.tap
      - name: Sintaxis y formato
        run: |
          npm run check
          git diff --check
      - name: Conservar evidencia de esta ejecución
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-temp/linux-artifacts/
          if-no-files-found: error
          retention-days: 7
